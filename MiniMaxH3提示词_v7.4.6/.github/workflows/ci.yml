# lemon-gitguard CI 模板 v1 —— 由 gitguard.ci_workflow 生成到各仓 .github/workflows/ci.yml。
# 手改单个仓库的工作流会被 G7 判「模板不一致」；要改条件请改本模板再重新 --write。
# MM-02：本子工作流已由仓库根 .github/workflows/ci.yml 矩阵 CI 统一接管，此处仅作历史/上游模板保留。
name: CI-MiniMaxH3提示词_v7.4.5

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # 不设这行，Windows runner 上任何中文断言失败都会被控制台编码吞成乱码
      PYTHONIOENCODING: "utf-8"
      # 单测前提是不外呼：代理钉到丢弃端口，漏网请求立即失败而不是产生费用
      HTTP_PROXY: "http://127.0.0.1:9"
      HTTPS_PROXY: "http://127.0.0.1:9"
      http_proxy: "http://127.0.0.1:9"
      https_proxy: "http://127.0.0.1:9"
      NO_PROXY: "127.0.0.1,localhost,::1"
      no_proxy: "127.0.0.1,localhost,::1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依赖（缺包即红，不静默跳过）
        run: |
          python -m pip install pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: 单测
        run: python -m pytest -q -p no:cacheprovider
