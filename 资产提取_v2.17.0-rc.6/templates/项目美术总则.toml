# 项目美术总则模板（v2.17.0 工单 5）
#
# 机器事实源是每个项目唯一一份 `.process/项目美术总则.json`（由引擎原子写、带内容指纹，
# 供增量依赖失效判定）；本文件只是**字段说明与填空示例**，供人工核对或宿主自行起草，
# 不参与运行时读取。九要素缺项写"未说明"，不得留空假装默认。
#
# 规则优先级固定：用户明确要求 > Omni标准 > 原文事实 > 项目美术总则 > 唯一主风格包 >
# 类型模板 > 必要补全。下游层永远不得覆盖上游层的确定值。

medium = "写实三维渲染"            # 媒介：三维渲染 / 2D 手绘 / 定格 等
realism = "国漫三维"               # 写实程度：照片级 / 风格化写实 / 卡通（三者互斥，选其一）
proportions = "写实头身比"          # 人物比例
materials = "物理渲染材质"          # 材质基线
palette = "玉清色调"               # 色彩：一个项目只能锁定一种饱和度方向（高饱和 或 低饱和）
lighting = "体积光"                # 光线
era = "仙侠古代"                   # 时代与题材
scene_aesthetic = "空灵飘渺"        # 场景空间审美
costume_aesthetic = "完整合体整洁"   # 服装审美：默认完整、合身、整洁、符合身份时代

# 破损、污渍、赤足、血迹、湿透等只有原文明示或用户指令才允许，题材/身份不能自动推出"脏破旧"。
# 禁止偏移方向：这些表达一旦与上面的确定值相斥（如"卡通"对"写实"）将在生图前被冲突门阻断。
forbidden = ["无现代元素", "无科技感", "无文字水印"]

# 用户人物参考图的身份约束高于风格包：风格包只控表现形式，不得改脸。
reference_hash = ""                # 已审核项目参考图的聚合哈希（无则留空）
