# 场景站位图模板（阶段 3 工单 3.2）
#
# 机器事实源是 `视觉资产/场景站位图/<场景ID>.toml`（由 scene_blocking 生成）；
# 本文件只是**字段说明与填空示例**，不参与运行时读取。
# 同一场景的后续图片必须继承本结构：左右位置、前后景、行动轴线与不可穿越区域都不得无故变化。

scene_id = "SC_例场景"
anchors = ["正门", "柜台", "楼梯口"]          # 固定锚点：连续画面里位置必须一致
entrances = ["正门", "后厨侧门"]
exits = ["正门", "后厨侧门"]
default_camera_direction = "从正门斜向内，朝向柜台"
axis = ["CH_例角色A", "CH_例角色B"]            # 行动轴线两端（180 度规则以它为准）
no_cross_zones = ["柜台后侧作业区"]            # 不可穿越：人物不得进入
notes = "二层与一层通过楼梯连接；窗外可见河面"

# 可站立区域：语义区域名 → 说明（审核按区域比对，不要求像素坐标）
[standable]
"左前" = "靠门一侧，适合迎接"
"中" = "主桌附近，适合对峙"
"右后" = "靠墙，适合旁观"
