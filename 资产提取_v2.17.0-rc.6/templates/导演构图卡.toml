# 导演构图卡模板（阶段 3 工单 3.1）
#
# 机器事实源是 `视觉资产/构图卡/<任务ID>.toml`（由 director_composition 生成，原子写、字节稳定）；
# 本文件只是**字段说明与填空示例**，用于人工核对或宿主自行起草，不参与运行时读取。
# 每个字段都要有来源：原始剧本 > 资产索引 > 分镜提示词 > 导演推导；推导必须标为推导。

task_id = "CH_例角色-剧情剧照-v01"
shot_size = "中景"                  # 远景 / 全景 / 中景 / 近景 / 特写
camera_angle = "平视"               # 平视 / 俯视 / 仰视 / 侧视 / 越肩
camera_height = "与人物胸口同高"     # 有剧情理由才允许偏离正常人眼高度
source_level = "导演推导"            # 原始剧本 / 资产索引 / 分镜提示词 / 导演推导
rationale = "交代两人对峙，保留双方上半身与桌面道具"

anchors = ["茶楼二层栏杆"]           # 场景固定锚点（来自场景母版）
forbidden = ["额外人物", "文字水印", "俯拍", "荷兰角"]   # 进入独立 negative_prompt 字段

# 每个主体一条；人数与资产事实一致，不得凭空添加
[[subjects]]
subject = "CH_例角色"
zone = "左"                          # 左 / 左中 / 中 / 右中 / 右
depth = "前景"                       # 前景 / 中景 / 后景
facing = "面向右侧"
gaze = "看着对面人物"
action = "以身体挡在两人之间"
occlusion = "遮住身后人物下半身"
distance = "一臂距离"

# 关键道具一条一件；数量与持有者必须与资产事实一致
[[props]]
name = "PR_例道具"
zone = "中"
holder = "CH_例角色"
count = 1
state = "缺角"

# 逐字段留证：来源与原文摘句（导演推导时 quote 写推导依据）
[[evidence]]
field = "shot_size"
source = "分镜提示词"
quote = "镜头推近到两人上半身"

[[evidence]]
field = "zone"
source = "导演推导"
quote = "剧本只写『挡在中间』，按保护关系推导为前景左区"

# 仅当剧本与分镜冲突时出现：保留剧本事实并记录两侧原文
[[conflicts]]
field = "zone"
kept = "左"
script = "老罗挡在两人之间"
storyboard = "老罗在画面右侧"
