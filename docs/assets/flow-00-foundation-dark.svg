<rect x="0.5" y="0.5" width="1279" height="363" rx="14" fill="#0D1117" stroke="#262D38" stroke-width="1"/>
<text class="m" x="48" y="34" font-size="11" font-weight="600" fill="#636C76" letter-spacing="2">00 · FOUNDATION GUARDRAILS  ·  给你的 AI 工作台装上四道工程护栏</text>
<rect x="48" y="56" width="580" height="134" rx="10" fill="#131922" stroke="#262D38" stroke-width="1"/><text class="m" x="68" y="82" font-size="10.5" font-weight="700" fill="#34D399" letter-spacing="1.4">01 · 管研发纪律</text><text class="m" x="608" y="82" text-anchor="end" font-size="11" fill="#EAB308">v1.2.0</text><text class="s" x="68" y="107" font-size="16" font-weight="600" fill="#F3F4F6">柠檬思考</text><line x1="68" y1="117" x2="608" y2="117" stroke="#1F2630" stroke-width="1"/><text class="s" x="68" y="138" font-size="12" font-weight="500" fill="#D1D5DB">先扫工作区文件判阶段 → 一次一问定方案 → 拆清工单 → 先测试再写代码 → 独立复核</text><text class="s" x="68" y="158" font-size="11.5" fill="#8B949E">治好 AI 常见顽疾：没问清楚就盲改代码、跳过测试硬糊弄、嘴上说完成了其实留半成品</text><rect x="68" y="166" width="540" height="18" rx="4" fill="#161D27"/><text class="s" x="76" y="178.5" font-size="10.5" fill="#8B949E">核心升级：已同步上游 superpowers v7.0.2 全套工程规范</text><rect x="652" y="56" width="580" height="134" rx="10" fill="#131922" stroke="#262D38" stroke-width="1"/><text class="m" x="672" y="82" font-size="10.5" font-weight="700" fill="#34D399" letter-spacing="1.4">02 · 管代码瘦身</text><text class="m" x="1212" y="82" text-anchor="end" font-size="11" fill="#EAB308">v1.1.0</text><text class="s" x="672" y="107" font-size="16" font-weight="600" fill="#F3F4F6">技能优化</text><line x1="672" y1="117" x2="1212" y2="117" stroke="#1F2630" stroke-width="1"/><text class="s" x="672" y="138" font-size="12" font-weight="500" fill="#D1D5DB">先画项目依赖地图 → 静态工具扫出重复与冗余代码 → 出清单等你批 → 精简后全量复测</text><text class="s" x="672" y="158" font-size="11.5" fill="#8B949E">治好重构恐惧症：拒绝凭感觉乱删，缺工具就老实报告阻塞，批哪块才动哪块</text><rect x="672" y="166" width="540" height="18" rx="4" fill="#161D27"/><text class="s" x="680" y="178.5" font-size="10.5" fill="#8B949E">核心升级：已同步上游 ponytail v5.3.3+ 审计规则</text><rect x="48" y="206" width="580" height="134" rx="10" fill="#131922" stroke="#262D38" stroke-width="1"/><text class="m" x="68" y="232" font-size="10.5" font-weight="700" fill="#34D399" letter-spacing="1.4">03 · 管跨端记忆</text><text class="m" x="608" y="232" text-anchor="end" font-size="11" fill="#EAB308">v1.0.3</text><text class="s" x="68" y="257" font-size="16" font-weight="600" fill="#F3F4F6">全局记忆 UMH</text><line x1="68" y1="267" x2="608" y2="267" stroke="#1F2630" stroke-width="1"/><text class="s" x="68" y="288" font-size="12" font-weight="500" fill="#D1D5DB">在自己电脑搭本地记忆总站（~/.umh） → 多个 AI 客户端按权限接入、共用同一份上下文</text><text class="s" x="68" y="308" font-size="11.5" fill="#8B949E">告别反复自我介绍：在 Cherry、Codex、Qoder 等工具间切换，项目习惯和偏好不断线</text><rect x="68" y="316" width="540" height="18" rx="4" fill="#161D27"/><text class="s" x="76" y="328.5" font-size="10.5" fill="#8B949E">边界诚实：纯本地保管、4,349 项分发校验全绿；Claude 原生适配保持未验证</text><rect x="652" y="206" width="580" height="134" rx="10" fill="#131922" stroke="#262D38" stroke-width="1"/><text class="m" x="672" y="232" font-size="10.5" font-weight="700" fill="#34D399" letter-spacing="1.4">04 · 管账单与上下文</text><text class="m" x="1212" y="232" text-anchor="end" font-size="11" fill="#EAB308">v92cc75f-r3</text><text class="s" x="672" y="257" font-size="16" font-weight="600" fill="#F3F4F6">RTK 压缩器</text><line x1="672" y1="267" x2="1212" y2="267" stroke="#1F2630" stroke-width="1"/><text class="s" x="672" y="288" font-size="12" font-weight="500" fill="#D1D5DB">跑构建/测试吐出千行刷屏日志 → 钩子自动折叠成高密度摘要 → 完整原文留本机回查</text><text class="s" x="672" y="308" font-size="11.5" fill="#8B949E">直接省上下文与 Token 费用：只有压缩后确实更短才生效，遇异常自动透明退回原输出</text><rect x="672" y="316" width="540" height="18" rx="4" fill="#161D27"/><text class="s" x="680" y="328.5" font-size="10.5" fill="#8B949E">核心升级：已适配 rtk v1.2.1 新增 10 项过滤器并兼容旧版降级（面向 Qoder CLI）</text>
</svg>