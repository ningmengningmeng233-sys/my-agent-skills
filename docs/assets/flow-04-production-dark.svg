<rect x="0.5" y="0.5" width="1279" height="391" rx="14" fill="#0D1117" stroke="#262D38" stroke-width="1"/>
<text class="m" x="48" y="34" font-size="11" font-weight="600" fill="#636C76" letter-spacing="2">04 · VISUAL PRODUCTION PIPELINE  ·  从剧本到成片：防变脸、防烧钱、先对账再渲染</text>
<rect x="48" y="96" width="196" height="196" rx="10" fill="#161D27" stroke="#262D38" stroke-width="1"/><text class="m" x="66" y="126" font-size="10.5" font-weight="700" fill="#EAB308" letter-spacing="1.4">INPUT · 上游输入</text><text class="s" x="66" y="156" font-size="16" font-weight="600" fill="#F3F4F6">原著小说 / 分镜</text><line x1="66" y1="170" x2="226" y2="170" stroke="#1F2630" stroke-width="1"/><text class="s" x="66" y="196" font-size="12" fill="#D1D5DB">• 分集剧本与台词</text><text class="s" x="66" y="220" font-size="12" fill="#D1D5DB">• 镜头分镜表</text><text class="s" x="66" y="244" font-size="12" fill="#D1D5DB">• 题材与画风要求</text><text class="s" x="66" y="274" font-size="11" fill="#8B949E">承接「小说转短剧」或自备文本</text><path d="M244 194 L274 194 L274 128 L302 128" fill="none" stroke="#4B5563" stroke-width="1.4"/><path d="M297 124 L303 128 L297 132" fill="none" stroke="#4B5563" stroke-width="1.4"/><path d="M274 194 L274 266 L302 266" fill="none" stroke="#4B5563" stroke-width="1.4"/><path d="M297 262 L303 266 L297 270" fill="none" stroke="#4B5563" stroke-width="1.4"/><rect x="306" y="64" width="486" height="126" rx="10" fill="#131922" stroke="#262D38" stroke-width="1"/><text class="s" x="326" y="94" font-size="15.5" font-weight="600" fill="#F3F4F6">资产提取 · 解决换场变脸与服装穿帮</text><text class="m" x="772" y="93" text-anchor="end" font-size="11" fill="#EAB308">v2.17.0-rc.8</text><text class="s" x="326" y="121" font-size="12.5" fill="#D1D5DB">抽取人物外貌、服饰变化、场景与道具 → 分配固定 ID 建连续性账本</text><text class="s" x="326" y="143" font-size="11.5" fill="#8B949E">每条设定均可追溯回原文章节，并产出下游可直接读取的标准提示词</text><rect x="326" y="155" width="378" height="22" rx="4" fill="#1F1B0E" stroke="#4A3D16" stroke-width="0.9"/><text class="s" x="336" y="170" font-size="11" fill="#EAB308">公开档边界：已排除 32 张私有风格图，仅提供文本与离线能力</text><rect x="306" y="206" width="486" height="126" rx="10" fill="#131922" stroke="#262D38" stroke-width="1"/><text class="s" x="326" y="236" font-size="15.5" font-weight="600" fill="#F3F4F6">MiniMax H3 提示词 · 上线前硬核安检省抽卡费</text><text class="m" x="772" y="235" text-anchor="end" font-size="11" fill="#EAB308">v7.4.6</text><text class="s" x="326" y="263" font-size="12.5" fill="#D1D5DB">按 H3 / H3-Max / Turbo 真实能力边界编排镜头、台词与参考图提示词</text><text class="s" x="326" y="285" font-size="11.5" fill="#8B949E">过 614 项静态规则审计：提交渲染前先拦下超长镜头、参数冲突与缺项</text><rect x="326" y="297" width="372" height="22" rx="4" fill="#161D27" stroke="#28313E" stroke-width="0.9"/><text class="s" x="336" y="312" font-size="11" fill="#8B949E">分工清晰：本包管写词与审计，实际出片交给你的外部视频平台</text><path d="M792 128 L824 128 L824 194 L854 194" fill="none" stroke="#4B5563" stroke-width="1.4"/><path d="M792 266 L824 266 L824 194" fill="none" stroke="#4B5563" stroke-width="1.4"/><path d="M849 190 L855 194 L849 198" fill="none" stroke="#4B5563" stroke-width="1.4"/><rect x="858" y="64" width="374" height="268" rx="10" fill="#0E201C" stroke="#1D4B40" stroke-width="1"/><text class="m" x="878" y="91" font-size="10.5" font-weight="700" fill="#34D399" letter-spacing="1.4">FINAL ASSEMBLY · v0.1.5</text><text class="s" x="878" y="118" font-size="17" font-weight="600" fill="#F3F4F6">成片合成 · 三表对账与总装</text><line x1="878" y1="132" x2="1212" y2="132" stroke="#1D4B40" stroke-width="1"/><rect x="878" y="148" width="334" height="46" rx="7" fill="#131922" stroke="#1D4B40" stroke-width="0.9"/><text class="s" x="892" y="168" font-size="12.5" font-weight="600" fill="#F3F4F6">① 三表对账</text><text class="s" x="892" y="185" font-size="11" fill="#8B949E">核对分镜表 + 配音表 + 资产账本是否对齐</text><rect x="878" y="206" width="334" height="46" rx="7" fill="#131922" stroke="#1D4B40" stroke-width="0.9"/><text class="s" x="892" y="226" font-size="12.5" font-weight="600" fill="#F3F4F6">② 零费演练</text><text class="s" x="892" y="243" font-size="11" fill="#8B949E">先生成渲染计划并离线跑通，不白花平台费</text><rect x="878" y="264" width="334" height="46" rx="7" fill="#131922" stroke="#1D4B40" stroke-width="0.9"/><text class="s" x="892" y="284" font-size="12.5" font-weight="600" fill="#F3F4F6">③ 分阶段总装</text><text class="s" x="892" y="301" font-size="11" fill="#8B949E">接入视频/配音/FFmpeg 逐段出片，失败不拖垮全片</text><rect x="48" y="346" width="1184" height="30" rx="7" fill="#161D27" stroke="#262D38" stroke-width="1"/><text class="s" x="66" y="365.5" font-size="11.5" fill="#8B949E">说明：三套技能通过根目录 schemas/ 共享数据契约首尾相接，也可各自单独使用；真实出片仍需自备视频/语音生成账号与授权素材。</text>
