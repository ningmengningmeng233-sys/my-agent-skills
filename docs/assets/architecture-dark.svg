    <circle cx="20" cy="68" r="2" fill="#EAB308"/><text class="s" x="30" y="72" font-size="13.5" fill="#D1D5DB">MiniMax H3 提示词</text><circle cx="20" cy="92" r="2" fill="#EAB308"/><text class="s" x="30" y="96" font-size="13.5" fill="#D1D5DB">资产提取</text><circle cx="20" cy="116" r="2" fill="#EAB308"/><text class="s" x="30" y="120" font-size="13.5" fill="#D1D5DB">成片合成</text>
    <text class="s" x="18" y="146" font-size="11.5" fill="#8B949E">分镜资产 → 审计提示词与成片</text>
