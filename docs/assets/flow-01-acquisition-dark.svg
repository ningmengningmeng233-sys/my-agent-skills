<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="408" viewBox="0 0 1280 408" role="img" aria-labelledby="f1t">
<title id="f1t">01 · 资料采集与归档工作流图解</title>
<defs>
  <style>
    .s { font-family: 'Inter','SF Pro Display','PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',system-ui,-apple-system,sans-serif; }
    .m { font-family: 'JetBrains Mono','SFMono-Regular','Cascadia Code',Consolas,monospace; }
  </style>
</defs>
<rect x="0.5" y="0.5" width="1279" height="407" rx="14" fill="#0D1117" stroke="#262D38" stroke-width="1"/>
<text class="m" x="48" y="34" font-size="11" font-weight="600" fill="#636C76" letter-spacing="2">01 · ACQUISITION WORKFLOW  ·  视频与消息采集：字幕优先、批量闸门、断点续跑</text>
<text class="s" x="52" y="68" font-size="11.5" font-weight="600" fill="#8B949E">技能名称</text><text class="s" x="228" y="68" font-size="11.5" font-weight="600" fill="#8B949E">① 扔给它什么</text><text class="s" x="484" y="68" font-size="11.5" font-weight="600" fill="#8B949E">② 智能分流与闸门</text><text class="s" x="746" y="68" font-size="11.5" font-weight="600" fill="#8B949E">③ 防翻车与断点机制</text><text class="s" x="1008" y="68" font-size="11.5" font-weight="600" fill="#8B949E">④ 本地落袋成果</text><rect x="48" y="82" width="160" height="80" rx="9" fill="#161D27" stroke="#262D38" stroke-width="1"/><text class="s" x="64" y="116" font-size="15.5" font-weight="600" fill="#F3F4F6">B 站转录</text><text class="m" x="64" y="138" font-size="11" fill="#EAB308">v5.5.6</text><rect x="224" y="82" width="228" height="80" rx="9" fill="#131922" stroke="#262D38" stroke-width="1"/><text class="s" x="240" y="115" font-size="13.5" font-weight="600" fill="#F3F4F6">B 站视频 · 多 P 合集</text><text class="s" x="240" y="138" font-size="11.5" fill="#8B949E">或整个收藏夹批量导入</text><line x1="456" y1="122" x2="475" y2="122" stroke="#4B5563" stroke-width="1.4"/><path d="M470 118 L476 122 L470 126" fill="none" stroke="#4B5563" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="82" width="234" height="80" rx="9" fill="#131922" stroke="#262D38" stroke-width="1"/><text class="s" x="496" y="115" font-size="13.5" font-weight="600" fill="#F3F4F6">字幕优先 · 语音兜底</text><text class="s" x="496" y="138" font-size="11.5" fill="#8B949E">先抓官方字幕，无字幕转语音识别</text><line x1="718" y1="122" x2="737" y2="122" stroke="#4B5563" stroke-width="1.4"/><path d="M732 118 L738 122 L732 126" fill="none" stroke="#4B5563" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="742" y="82" width="234" height="80" rx="9" fill="#1F1B0E" stroke="#4A3D16" stroke-width="1"/><text class="s" x="758" y="115" font-size="13.5" font-weight="600" fill="#F3F4F6">本地进度库自动去重</text><text class="s" x="758" y="138" font-size="11.5" fill="#D1D5DB">按分 P 记录进度，断网绝不重跑</text><line x1="980" y1="122" x2="999" y2="122" stroke="#4B5563" stroke-width="1.4"/><path d="M994 118 L1000 122 L994 126" fill="none" stroke="#4B5563" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1004" y="82" width="228" height="80" rx="9" fill="#0E201C" stroke="#1D4B40" stroke-width="1"/><text class="s" x="1020" y="115" font-size="13.5" font-weight="600" fill="#F3F4F6">干净文稿 + 摘要</text><text class="s" x="1020" y="138" font-size="11.5" fill="#D1D5DB">标准 TXT · 原始记录 · 摘要</text><rect x="48" y="174" width="160" height="80" rx="9" fill="#161D27" stroke="#262D38" stroke-width="1"/><text class="s" x="64" y="208" font-size="15.5" font-weight="600" fill="#F3F4F6">抖音转录</text><text class="m" x="64" y="230" font-size="11" fill="#EAB308">v2.0.7</text><rect x="224" y="174" width="228" height="80" rx="9" fill="#131922" stroke="#262D38" stroke-width="1"/><text class="s" x="240" y="207" font-size="13.5" font-weight="600" fill="#F3F4F6">抖音链接 · 分享文案</text><text class="s" x="240" y="230" font-size="11.5" fill="#8B949E">或批量链接清单 TXT</text><line x1="456" y1="214" x2="475" y2="214" stroke="#4B5563" stroke-width="1.4"/><path d="M470 210 L476 214 L470 218" fill="none" stroke="#4B5563" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="174" width="234" height="80" rx="9" fill="#131922" stroke="#262D38" stroke-width="1"/><text class="s" x="496" y="207" font-size="13.5" font-weight="600" fill="#F3F4F6">超量先预览再开跑</text><text class="s" x="496" y="230" font-size="11.5" fill="#8B949E">超 10 条或 30 分钟暂停等你点头</text><line x1="718" y1="214" x2="737" y2="214" stroke="#4B5563" stroke-width="1.4"/><path d="M732 210 L738 214 L732 218" fill="none" stroke="#4B5563" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="742" y="174" width="234" height="80" rx="9" fill="#1F1B0E" stroke="#4A3D16" stroke-width="1"/><text class="s" x="758" y="207" font-size="13.5" font-weight="600" fill="#F3F4F6">失败单条断点续跑</text><text class="s" x="758" y="230" font-size="11.5" fill="#D1D5DB">保留原声文本，限流/失联精准恢复</text><line x1="980" y1="214" x2="999" y2="214" stroke="#4B5563" stroke-width="1.4"/><path d="M994 210 L1000 214 L994 218" fill="none" stroke="#4B5563" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1004" y="174" width="228" height="80" rx="9" fill="#0E201C" stroke="#1D4B40" stroke-width="1"/><text class="s" x="1020" y="207" font-size="13.5" font-weight="600" fill="#F3F4F6">带时间戳主稿</text><text class="s" x="1020" y="230" font-size="11.5" fill="#D1D5DB">主 TXT · 时间戳 · 可选 OCR/摘要</text><rect x="48" y="266" width="160" height="80" rx="9" fill="#161D27" stroke="#262D38" stroke-width="1"/><text class="s" x="64" y="300" font-size="15.5" font-weight="600" fill="#F3F4F6">Telegram 归档</text><text class="m" x="64" y="322" font-size="11" fill="#EAB308">v1.0.3</text><rect x="224" y="266" width="228" height="80" rx="9" fill="#131922" stroke="#262D38" stroke-width="1"/><text class="s" x="240" y="299" font-size="13.5" font-weight="600" fill="#F3F4F6">频道 · 群聊 · 私聊</text><text class="s" x="240" y="322" font-size="11.5" fill="#8B949E">或已有 TG 导出 JSON</text><line x1="456" y1="306" x2="475" y2="306" stroke="#4B5563" stroke-width="1.4"/><path d="M470 302 L476 306 L470 310" fill="none" stroke="#4B5563" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="266" width="234" height="80" rx="9" fill="#131922" stroke="#262D38" stroke-width="1"/><text class="s" x="496" y="299" font-size="13.5" font-weight="600" fill="#F3F4F6">白名单划定抓取边界</text><text class="s" x="496" y="322" font-size="11.5" fill="#8B949E">限定对象、时间段与附件类型</text><line x1="718" y1="306" x2="737" y2="306" stroke="#4B5563" stroke-width="1.4"/><path d="M732 302 L738 306 L732 310" fill="none" stroke="#4B5563" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="742" y="266" width="234" height="80" rx="9" fill="#1F1B0E" stroke="#4A3D16" stroke-width="1"/><text class="s" x="758" y="299" font-size="13.5" font-weight="600" fill="#F3F4F6">断点留痕 · 增量更新</text><text class="s" x="758" y="322" font-size="11.5" fill="#D1D5DB">只拉新消息，避免重复下载刷爆盘</text><line x1="980" y1="306" x2="999" y2="306" stroke="#4B5563" stroke-width="1.4"/><path d="M994 302 L1000 306 L994 310" fill="none" stroke="#4B5563" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1004" y="266" width="228" height="80" rx="9" fill="#0E201C" stroke="#1D4B40" stroke-width="1"/><text class="s" x="1020" y="299" font-size="13.5" font-weight="600" fill="#F3F4F6">可读归档与附件</text><text class="s" x="1020" y="322" font-size="11.5" fill="#D1D5DB">分类附件 · 阅读视图 · 分享副本</text><rect x="48" y="356" width="1184" height="32" rx="7" fill="#161D27" stroke="#262D38" stroke-width="1"/><circle cx="68" cy="372" r="3.5" fill="#34D399"/><text class="s" x="82" y="376.5" font-size="12" fill="#D1D5DB"><tspan font-weight="600" fill="#F3F4F6">核心优势：</tspan>每条采集任务都带本地“进度账本”——遇到断网、关机或平台限流，下次从断点继续，已转好的绝不重复花时间和费用。</text>
</svg>