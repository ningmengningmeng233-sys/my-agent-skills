<rect x="0.5" y="0.5" width="1279" height="435" rx="14" fill="#FAF9F6" stroke="#E5E2DC" stroke-width="1"/>
<text class="m" x="48" y="34" font-size="11" font-weight="600" fill="#9C988F" letter-spacing="2">02 · TRACEABLE INDEXING  ·  为什么它回答百万字资料不瞎编？</text>
<rect x="48" y="54" width="576" height="68" rx="9" fill="#FDF2F4" stroke="#F2CDD6" stroke-width="1"/><text class="m" x="66" y="77" font-size="11" font-weight="700" fill="#9F1239" letter-spacing="1">×  普通 AI 直接提问长文档</text><text class="s" x="66" y="103" font-size="12.5" fill="#3F3E3B">书太长塞不下 → 只凭碎片印象猜答案 → 容易串章、编造原句、没法核对出处</text><rect x="656" y="54" width="576" height="68" rx="9" fill="#EFF9F7" stroke="#BFE2DC" stroke-width="1"/><text class="m" x="674" y="77" font-size="11" font-weight="700" fill="#0F766E" letter-spacing="1">✓  本套溯源索引引擎的做法</text><text class="s" x="674" y="103" font-size="12.5" fill="#3F3E3B">索引只负责“指路” → 命中后强制翻回原文件读原文 → 自动核对行号 → 句句带出处</text><rect x="48" y="148" width="266" height="114" rx="10" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/><text class="m" x="66" y="174" font-size="10.5" font-weight="700" fill="#A16207" letter-spacing="1.4">STEP 01</text><text class="s" x="66" y="199" font-size="15.5" font-weight="600" fill="#141413">自动切段建目录</text><text class="s" x="66" y="225" font-size="12" fill="#706D66">把几十万至百万字原文</text><text class="s" x="66" y="244" font-size="12" fill="#706D66">拆成稳定段文件与全书导航</text><line x1="320" y1="205" x2="347" y2="205" stroke="#B8B3A9" stroke-width="1.4"/><path d="M342 201 L348 205 L342 209" fill="none" stroke="#B8B3A9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="354" y="148" width="266" height="114" rx="10" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/><text class="m" x="372" y="174" font-size="10.5" font-weight="700" fill="#A16207" letter-spacing="1.4">STEP 02</text><text class="s" x="372" y="199" font-size="15.5" font-weight="600" fill="#141413">双路查表找候选</text><text class="s" x="372" y="225" font-size="12" fill="#706D66">关键词 + 语义混合检索</text><text class="s" x="372" y="244" font-size="12" fill="#706D66">精准圈出最相关的几个段落</text><line x1="626" y1="205" x2="653" y2="205" stroke="#B8B3A9" stroke-width="1.4"/><path d="M648 201 L654 205 L648 209" fill="none" stroke="#B8B3A9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="660" y="148" width="266" height="114" rx="10" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/><text class="m" x="678" y="174" font-size="10.5" font-weight="700" fill="#A16207" letter-spacing="1.4">STEP 03</text><text class="s" x="678" y="199" font-size="15.5" font-weight="600" fill="#141413">强制回读核行号</text><text class="s" x="678" y="225" font-size="12" fill="#706D66">拒绝靠摘要闭眼作答</text><text class="s" x="678" y="244" font-size="12" fill="#706D66">回读原句并校验精确起止行</text><line x1="932" y1="205" x2="959" y2="205" stroke="#B8B3A9" stroke-width="1.4"/><path d="M954 201 L960 205 L954 209" fill="none" stroke="#B8B3A9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="966" y="148" width="266" height="114" rx="10" fill="#EFF9F7" stroke="#BFE2DC" stroke-width="1"/><text class="m" x="984" y="174" font-size="10.5" font-weight="700" fill="#0F766E" letter-spacing="1.4">STEP 04</text><text class="s" x="984" y="199" font-size="15.5" font-weight="600" fill="#141413">句句带出处作答</text><text class="s" x="984" y="225" font-size="12" fill="#706D66">结论附上文件名与行号</text><text class="s" x="984" y="244" font-size="12" fill="#706D66">你点回原文一秒就能复核</text><line x1="242" y1="262" x2="242" y2="294" stroke="#B8B3A9" stroke-width="1" stroke-dasharray="3 4"/><line x1="640" y1="262" x2="640" y2="294" stroke="#B8B3A9" stroke-width="1" stroke-dasharray="3 4"/><line x1="1038" y1="262" x2="1038" y2="294" stroke="#B8B3A9" stroke-width="1" stroke-dasharray="3 4"/><rect x="48" y="294" width="376" height="114" rx="10" fill="#F4F2EC" stroke="#E5E2DC" stroke-width="1"/><text class="s" x="66" y="326" font-size="15" font-weight="600" fill="#141413">知识库转录</text><text class="m" x="406" y="325" text-anchor="end" font-size="11" fill="#A16207">v5.4.9</text><line x1="66" y1="339" x2="406" y2="339" stroke="#EAE7E1" stroke-width="1"/><text class="s" x="66" y="364" font-size="12.5" font-weight="500" fill="#3F3E3B">适合：书籍 · 教材 · 手册 · 课程笔记</text><text class="s" x="66" y="388" font-size="11.5" fill="#706D66">支持多接口故障自动切换与跨平台路径防重</text><rect x="452" y="294" width="376" height="114" rx="10" fill="#F4F2EC" stroke="#E5E2DC" stroke-width="1"/><text class="s" x="470" y="326" font-size="15" font-weight="600" fill="#141413">小说索引</text><text class="m" x="810" y="325" text-anchor="end" font-size="11" fill="#A16207">v4.6.3</text><line x1="470" y1="339" x2="810" y2="339" stroke="#EAE7E1" stroke-width="1"/><text class="s" x="470" y="364" font-size="12.5" font-weight="500" fill="#3F3E3B">适合：百万字长篇小说 · 连载追更</text><text class="s" x="470" y="388" font-size="11.5" fill="#706D66">秒查人物出场、伏笔脉络与前后设定变化</text><rect x="856" y="294" width="376" height="114" rx="10" fill="#F4F2EC" stroke="#E5E2DC" stroke-width="1"/><text class="s" x="874" y="326" font-size="15" font-weight="600" fill="#141413">知识转录索引</text><text class="m" x="1214" y="325" text-anchor="end" font-size="11" fill="#A16207">v1.5.1</text><line x1="874" y1="339" x2="1214" y2="339" stroke="#EAE7E1" stroke-width="1"/><text class="s" x="874" y="364" font-size="12.5" font-weight="500" fill="#3F3E3B">适合：B 站转录本地资料夹（含 BV 号）</text><text class="s" x="874" y="388" font-size="11.5" fill="#706D66">内置三道只读锁：绝不私自修改原始转录稿</text>
</svg>