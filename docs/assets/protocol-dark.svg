<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="224" viewBox="0 0 1280 224" role="img" aria-labelledby="pt">
<title id="pt">柠檬思考四阶段研发协议</title>
<defs>
  <style>
    .s { font-family: 'Inter','SF Pro Display','PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',system-ui,-apple-system,sans-serif; }
    .m { font-family: 'JetBrains Mono','SFMono-Regular','Cascadia Code',Consolas,monospace; }
  </style>
</defs>

<rect x="0.5" y="0.5" width="1279" height="223" rx="14" fill="#0D1117" stroke="#262D38" stroke-width="1"/>
<text class="m" x="48" y="34" font-size="11" font-weight="600" fill="#636C76" letter-spacing="2">LEMON-THINKING PROTOCOL  ·  物理文件驱动的四阶段研发协议</text>

<!-- Connecting Hairline -->
<line x1="182" y1="96" x2="1098" y2="96" stroke="#262D38" stroke-width="1.5"/>


  <g transform="translate(160 96)" text-anchor="middle">
    <circle r="22" fill="#131922" stroke="#F3F4F6" stroke-width="1.5"/>
    <text class="m" y="5" font-size="13" font-weight="700" fill="#F3F4F6">01</text>
    <text class="s" y="50" font-size="16" font-weight="600" fill="#F3F4F6">需求拷问对齐</text>
    <text class="s" y="72" font-size="12.5" fill="#8B949E">一次一问澄清边界 · 拒绝盲写</text>
    <rect x="-82" y="84" width="164" height="22" rx="4" fill="#161D27" stroke="#28313E" stroke-width="0.9"/>
    <text class="m" y="99" font-size="10.5" fill="#C9D1D9">产出：设计方案.md</text>
  </g>
  <g transform="translate(480 96)" text-anchor="middle">
    <circle r="22" fill="#131922" stroke="#F3F4F6" stroke-width="1.5"/>
    <text class="m" y="5" font-size="13" font-weight="700" fill="#F3F4F6">02</text>
    <text class="s" y="50" font-size="16" font-weight="600" fill="#F3F4F6">原子工单拆解</text>
    <text class="s" y="72" font-size="12.5" fill="#8B949E">每步明确文件、断言与回滚点</text>
    <rect x="-82" y="84" width="164" height="22" rx="4" fill="#161D27" stroke="#28313E" stroke-width="0.9"/>
    <text class="m" y="99" font-size="10.5" fill="#C9D1D9">产出：实施计划.md</text>
  </g>
  <g transform="translate(800 96)" text-anchor="middle">
