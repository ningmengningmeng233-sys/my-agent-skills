<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 知识仓库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Microsoft YaHei',sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh;font-size:18px}
.header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);padding:30px 20px 20px;text-align:center;border-bottom:1px solid #2a2a4a}
.header h1{font-size:32px;color:#fff}
.header p{color:#888;font-size:15px;margin-top:6px}
.tabs{display:flex;max-width:900px;margin:0 auto;border-bottom:1px solid #2a2a4a;padding:0 20px}
.tab-btn{padding:14px 28px;font-size:16px;cursor:pointer;background:transparent;border:none;color:#666;border-bottom:3px solid transparent;transition:all .2s}
.tab-btn:hover{color:#aaa}
.tab-btn.active{color:#6c5ce7;border-bottom-color:#6c5ce7}
#tab-search .search-box{max-width:900px;margin:24px auto 0;padding:0 20px}
#tab-search .search-box form{display:flex;gap:10px;background:#1e1e36;border:1px solid #3a3a5a;border-radius:12px;padding:6px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#tab-search .search-box input{flex:1;border:none;background:transparent;padding:16px 20px;font-size:20px;color:#fff;outline:none}
#tab-search .search-box input::placeholder{color:#555}
#tab-search .search-box button{background:#6c5ce7;color:#fff;border:none;border-radius:8px;padding:14px 32px;font-size:18px;cursor:pointer;transition:background .2s}
#tab-search .search-box button:hover{background:#7c6cf7}
#tab-search .search-box button:disabled{opacity:.6;cursor:wait}
#tab-search .filters{max-width:900px;margin:14px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap}
#tab-search .filters label{display:flex;align-items:center;gap:4px;font-size:15px;color:#888;cursor:pointer}
#tab-search .filters input[type=radio]{accent-color:#6c5ce7}
.results{max-width:900px;margin:20px auto;padding:0 20px}
.result-card{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:10px;padding:20px;margin-bottom:16px;transition:border-color .2s}
.result-card:hover{border-color:#6c5ce7}
.result-meta{font-size:14px;color:#666;margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.result-meta .tag{display:inline-block;padding:3px 10px;border-radius:4px;font-size:13px;margin-right:6px}
.tag-bilibili{background:#1a3a4a;color:#5bc0eb}
.tag-note,.tag-doc{background:#2a3a1a;color:#8bc34a}
.tag-wechat{background:#3a2a1a;color:#ff9800}
.tag-other{background:#2a2a2a;color:#aaa}
.tag-concept{background:rgba(96,165,250,.16);color:#7aa8ff}
.tag-method{background:rgba(52,211,153,.14);color:#5fe3b3}
.tag-data{background:rgba(251,191,36,.14);color:#ffd166}
.tag-view{background:rgba(192,132,252,.15);color:#d3a6ff}
.tag-line{background:#0f0f1a;color:#5bc0eb;border:1px solid #2a2a4a}
.tag-score{background:#0f0f1a;color:#ffd700;border:1px solid #2a2a4a}
.result-title{font-size:17px;color:#fff;margin-bottom:6px}
.result-range{font-size:13px;color:#888;margin-bottom:8px}
.result-text{font-size:15px;color:#999;line-height:1.7}
.result-text h4{font-size:15px;color:#fff;margin:10px 0 6px}
.result-text ul{list-style:none;margin:6px 0;display:flex;flex-direction:column;gap:6px}
.result-text li{background:#101024;border:1px solid #2a2a4a;border-radius:8px;padding:8px 12px}
.result-text li.quote{border-left:3px solid #ffd700}
.result-text em{color:#ffd700;font-style:normal}
.result-text table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
.result-text th,.result-text td{border:1px solid #2a2a4a;padding:6px 8px;text-align:left}
.result-text th{background:#101024;color:#fff}
.result-score{font-size:13px;color:#555;margin-top:6px}
.result-links{font-size:13px;color:#666;margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.result-links code{background:#0f0f1a;padding:2px 6px;border-radius:4px}
.result-links a{color:#6c5ce7;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.tab-content{display:none;max-width:900px;margin:20px auto;padding:0 20px}
.tab-content.active{display:block}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:24px}
.stat-card{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:10px;padding:20px;text-align:center}
.stat-card .num{font-size:36px;color:#6c5ce7;font-weight:bold}
.stat-card .label{font-size:14px;color:#888;margin-top:4px}
.file-list{margin-top:16px}
.file-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:8px;margin-bottom:8px;font-size:15px}
.file-row .source-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;flex-shrink:0}
.file-row .fname{flex:1;color:#ccc;word-break:break-all}
.file-row .fsize{color:#666;font-size:13px;flex-shrink:0}
.file-row .indexed{color:#4caf50;font-size:13px;flex-shrink:0}
.file-row .not-indexed{color:#ff5722;font-size:13px;flex-shrink:0}
.setting-group{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:10px;padding:20px;margin-bottom:16px}
.setting-group h3{font-size:18px;color:#fff;margin-bottom:12px}
.setting-group label{display:block;margin-bottom:8px;font-size:15px;color:#aaa}
.setting-group input[type=text]{width:100%;padding:12px 14px;font-size:16px;background:#0f0f1a;border:1px solid #3a3a5a;border-radius:8px;color:#fff;outline:none}
.setting-group input[type=text]:focus{border-color:#6c5ce7}
.src-list{margin:12px 0}
.src-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0f0f1a;border:1px solid #2a2a4a;border-radius:6px;margin-bottom:6px;font-size:15px}
.src-item .name{flex:1;color:#ccc}
.btn{padding:12px 28px;border:none;border-radius:8px;font-size:16px;cursor:pointer;transition:.2s}
.btn-primary{background:#6c5ce7;color:#fff}
.btn-primary:hover{background:#7c6cf7}
.btn-success{background:#4caf50;color:#fff}
.btn-success:hover{background:#5cbf60}
.toast{position:fixed;top:20px;right:20px;padding:14px 24px;border-radius:8px;font-size:15px;z-index:999;transition:opacity .3s}
.toast.success{background:#4caf50;color:#fff}
.toast.error{background:#e74c3c;color:#fff}
.toast.info{background:#333;color:#e0e0e0}
.loading{text-align:center;padding:40px;color:#666;font-size:16px}
.status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.status-dot.online{background:#4caf50}
.status-dot.offline{background:#e74c3c}
.viewer{background:#0b0b18;border:1px solid #2a2a4a;border-radius:10px;padding:14px;max-height:60vh;overflow:auto;font-family:Consolas,Menlo,monospace;font-size:13px}
.viewer .ln{padding:2px 8px;border-radius:4px;white-space:pre-wrap;word-break:break-all}
.viewer .ln.hit{background:rgba(255,215,0,.12);border-left:3px solid #ffd700}
.viewer .no{color:#555;margin-right:10px;user-select:none}
.tldr{background:#101024;border:1px solid #3a3a5a;border-left:4px solid #6c5ce7;border-radius:8px;padding:12px 14px;margin:10px 0}
.tldr-title{font-size:13px;color:#6c5ce7;font-weight:700;margin-bottom:6px}
.tldr-text{font-size:14px;color:#ddd;line-height:1.7}
.tldr-points{margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.tldr-points li{background:transparent;border:none;padding:0;font-size:14px;color:#bbb}
.kb-counts{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.kb-list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.kb-item{display:flex;gap:8px;align-items:flex-start;background:#101024;border:1px solid #2a2a4a;border-radius:8px;padding:8px 12px;font-size:14px;color:#ccc;line-height:1.65}
.kb-item .txt{flex:1}
details.kb-more{margin:6px 0;border:1px dashed #3a3a5a;border-radius:8px;background:transparent}
details.kb-more summary{cursor:pointer;padding:8px 12px;font-size:13px;color:#8f8fb3;user-select:none}
details.kb-more summary:hover{color:#cfcfff}
details.kb-more .inner{padding:2px 8px 10px}
</style>
</head>
<body>
<div id="fatalError" style="display:none;max-width:900px;margin:16px auto;padding:12px 16px;border:1px solid #e74c3c;border-radius:8px;background:#2a1215;color:#ffb4ab;font-size:14px;"></div>
<div class="header">
  <h1>📖 知识仓库</h1>
  <p>搜索与管理你的资料</p>
</div>
<div class="tabs" id="tabNav">
  <button class="tab-btn active" data-tab="search">🔍 搜索</button>
  <button class="tab-btn" data-tab="manage">📊 管理</button>
  <button class="tab-btn" data-tab="settings">⚙️ 设置</button>
</div>
<div id="tab-search" class="tab-content active">
  <div class="search-box">
    <div role="search" id="searchForm" style="display:flex;gap:10px;">
      <input type="text" id="query" placeholder="输入问题，例如「红烧肉怎么做」「Docker 部署流程」" autofocus>
      <button type="button" id="btnSearch">搜索</button>
    </div>
  </div>
  <div style="text-align:center;font-size:13px;color:#555;padding:4px 0 12px;">💡 用自然语言描述你想找的内容，越具体越准</div>
  <div style="max-width:900px;margin:0 auto;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap;">
    <button class="btn btn-primary" style="padding:8px 16px;font-size:14px;" onclick="quickAsk('大模型为什么会产生幻觉')">幻觉成因</button>
    <button class="btn btn-primary" style="padding:8px 16px;font-size:14px;" onclick="quickAsk('RLHF训练顺序是什么')">RLHF 顺序</button>
    <button class="btn btn-primary" style="padding:8px 16px;font-size:14px;" onclick="quickAsk('预训练语料有多大')">预训练规模</button>
    <button class="btn btn-primary" style="padding:8px 16px;font-size:14px;" onclick="quickAsk('提示词技巧有哪些')">提示词技巧</button>
  </div>
  <div id="results" class="results"></div>
  <div id="searchStats" class="stats" style="text-align:center;font-size:14px;color:#444;padding:20px;"></div>
</div>
<div id="tab-manage" class="tab-content">
  <div id="statsArea" class="loading">加载中...</div>
  <div id="indexStatus"></div>
  <div id="fileListArea"></div>
</div>
<div id="tab-settings" class="tab-content">
  <div class="setting-group">
    <h3>📂 知识库路径</h3>
    <label>当前生效的知识库目录（后端 --lib 参数决定，页面内不可漂移）</label>
    <input type="text" id="knowledgeDir" readonly>
    <p style="font-size:13px;color:#666;margin-top:6px;">如需切换知识库，请重启后端服务并传入新的 --lib 路径</p>
  </div>
  <div class="setting-group">
    <h3>🧠 本地向量状态</h3>
    <div id="ollamaStatus"><span class="loading">检测中...</span></div>
  </div>
  <div class="setting-group">
    <h3>📁 标准三目录健康度</h3>
    <div id="libHealth"><span class="loading">检测中...</span></div>
  </div>
</div>
<script src="bootstrap.js"></script>
<script src="app.js"></script>
</body>
</html>
