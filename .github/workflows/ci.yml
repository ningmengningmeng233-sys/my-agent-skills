# 自制 skill 柜 · 根目录矩阵 CI（全 16 套公开技能 pytest + 跨技能契约门 + UMH Node 双检）。
# 凡 GitHub Actions 实际执行的 CI，以本文件为准。
name: CI-skill-cabinet-root-matrix

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cabinet-contracts:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 安装根契约校验依赖
        run: python -m pip install pytest pyyaml
      - name: 跨技能契约与公开树对账
        run: python -X utf8 schemas/contract_check.py
      - name: 发布身份与全仓规范测试
        run: python -m pytest -q -p no:cacheprovider schemas/tests
      - name: 全仓一致性自动化体检
        run: python -X utf8 scripts/cabinet_tools.py check
      - name: 全局记忆 UMH Node 分发包完整性与单测
        run: |
          node --test "全局记忆UMH_v1.0.3/scripts/verify-bundle.test.mjs"
          node "全局记忆UMH_v1.0.3/scripts/setup.mjs" --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        package:
          - "MiniMaxH3提示词_v7.4.6"
          - "rtk-token-reducer_v92cc75f-r3"
          - "tg转录_v1.0.3"
          - "全局记忆UMH_v1.0.3"
          - "去AI味_v2.0.3"
          - "小说转短剧_v1.5.6"
          - "成片合成_v0.1.5"
          - "技能优化_v1.1.0"
          - "日系小说本地化_v4.5.7"
          - "柠檬思考_v1.2.0"
          - "知识库转录_v5.4.9"
          - "资产提取_v2.17.0-rc.8"
          - "抖音转录_v2.0.7"
          - "小说索引_v4.6.3"
          - "B站转录_v5.5.6"
          - "知识转录索引_v1.5.1"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 系统依赖 ffmpeg（仅 B站转录）
        if: contains(matrix.package, 'B站转录')
        working-directory: .
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then exit 0; fi
          if [ "$RUNNER_OS" = "Windows" ]; then choco install ffmpeg -y --no-progress; else sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: 依赖（缺包即红，不静默跳过）
        run: |
          python -m pip install pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi
      - name: 单测（各包既有 pytest，隔离断网防外呼）
        env:
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          NO_PROXY: "127.0.0.1,localhost,::1"
        run: python -m pytest -q -p no:cacheprovider
