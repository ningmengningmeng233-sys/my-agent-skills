# 视觉计划模板（工单02-Task4）
#
# 用法：复制到 <资产库>/视觉资产/计划.toml 后按项目填写并替换全部 <...> 占位符；
# **不要手工维护 Markdown 阅读稿**——阅读稿由本文件渲染（scripts/render_visual_plan.py）。
#
# 口径：
# - TOML 是唯一机器事实源；Markdown 只读、可随时重建。
# - 任务 ID：<资产ID>-<任务种类>-vNN（vNN 为版本序号，同资产同任务可多版本并存）。
# - 任务种类：正脸 / 后脑 / 服装独立正面 / 服装独立背面 / 人物全身正面 / 人物全身背面 /
#   场景母版 / 道具 / 拼版。
# - 画幅固定（规格 6.3）：正脸·后脑·道具 = 1:1；服装独立图·人物全身 = 2:3；场景母版 = 16:9。
# - 状态（内部英文枚举，用户界面一律中文）：
#   PLANNED 待生成 → GENERATED 已生成待检查 → QC_PENDING 质检中 →
#   ACCEPTED 已通过 / NEEDS_REVISION 需修改 → … → NEEDS_HUMAN_DECISION 需要人工决定；
#   READY_AS_REFERENCE 可作为参考；NEEDS_REVIEW 需要重新检查（上游替换后）；
#   AWAITING_MANUAL_RESULT 等待手工结果（无 API 时的手工导出）。
# - 参考图职责只允许 identity / structure / style / material / lighting / space，
#   职责不得越权（皮肤材质参考不能覆盖角色身份，全身风格参考不得复制其服装）。
# - 每项资产最多自动返工 3 轮；未通过（非 ACCEPTED / READY_AS_REFERENCE）的任务
#   不得成为下游依赖。
# - 所有路径为资产库内相对路径（正斜杠）；版本与内容哈希固定后，母版更新只提示、
#   不自动改变项目。
#
# 本模板示例（正脸已通过 → 后脑待生成 → 场景母版待生成）替换占位符后即可通过校验：
# 校验器只看结构与固定契约，占位符 <...> 会被当作真实值原样处理。

