[project]
name = "novel-localization-v4"
version = "4.4.1.dev0"
description = "中文日系小说本地化 v4 Core"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
